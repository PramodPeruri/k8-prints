apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: prints
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: prints
  # these are replica set labels
  labels:
    project: prints
    componenet: catalogue
    tier: backend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      componenet: catalogue
      tier: backend
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        componenet: catalogue
        tier: backend
    spec:
      containers:
      - name: catalogue
        image: peruripramod/catalogue:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
             name: catalogue
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: prints
spec:
  selector:
    project: prints
    componenet: catalogue
    tier: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080