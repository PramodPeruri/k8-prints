apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
  namespace: prints
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGIE_PORT: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  Namespace: prints
  # these are replica set labels
  labels:
    project: prints
    componenet: cart
    tier: backend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      componenet: cart
      tier: backend
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        componenet: cart
        tier: backend
    spec:
      containers:
      - name: cart
        image: peruripramod/cart
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
             name: cart
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodseconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodseconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: prints
spec:
  selector:
    project: prints
    componenet: cart
    tier: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080