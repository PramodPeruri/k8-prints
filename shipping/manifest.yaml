apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
  namespace: prints
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: prints
  # these are replica set labels
  labels:
    project: prints
    componenet: shipping
    tier: backend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      componenet: shipping
      tier: backend
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        componenet: shipping
        tier: backend
    spec:
      containers:
      - name: shipping
        image: peruripramod/shipping:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
             name: shipping
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: prints
spec:
  selector:
    project: prints
    componenet: shipping
    tier: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080