apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  Namespace: prints
  # these are replica set labels
  labels:
    project: prints
    componenet: redis
    tier: db
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      componenet: redis
      tier: db
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        componenet: redis
        tier: db
    spec:
      containers:
      - name: redis
        image: redis:7.0
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: prints
spec:
  selector:
    project: prints
    componenet: redis
    tier: db
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379