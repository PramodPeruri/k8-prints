apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  namespace: roboshop
data:
  nginx.conf: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log warn;
      pid /var/run/nginx.pid;

      events { worker_connections 1024; }

      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;
          sendfile on;
          keepalive_timeout 65;

          server {
              listen 80;
              server_name localhost;
              root /usr/share/nginx/html;

              location /api/catalogue/ {
                  proxy_pass http://catalogue:8080/;
              }
              location /api/user/ {
                  proxy_pass http://user:8080/;
              }
              location /api/cart/ {
                  proxy_pass http://cart:8080/;
              }
              location /api/shipping/ {
                  proxy_pass http://shipping:8080/;
              }
              location /api/payment/ {
                  proxy_pass http://payment:8080/;
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prints
data:
  nginx.conf: |
    # these are replica set labels
  labels:
    project: prints
    componenet: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      componenet: frontend
      tier: frontend
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        componenet: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: peruripramod/frontend:v1
        imagePullPolicy: Always
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prints
spec:
  type: LoadBalancer
  selector:
    project: prints
    componenet: frontend
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80