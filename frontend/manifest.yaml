apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prints
  # these are replica set labels
  labels:
    project: prints
    componenet: frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
      project: prints
      componenet: frontend
      tier: frontend
  # pod definition
  template:
    metadata:
      labels:
        project: prints
        componenet: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: peruripramod/frontend
        imagePullPolicy: Always
        ports:
        - name: liveness-port
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prints
spec:
  type: LoadBalancer
  selector:
    project: prints
    componenet: frontend
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80