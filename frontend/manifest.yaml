apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend
  namespace: prints
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;

    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        sendfile on;
        keepalive_timeout 65;

        server {
            listen 80;
            server_name localhost;

            root /usr/share/nginx/html;

            location /api/catalogue/ {
                proxy_pass http://catalogue:8080/;
            }

            location /api/user/ {
                proxy_pass http://user:8080/;
            }

            location /api/cart/ {
                proxy_pass http://cart:8080/;
            }

            location /api/shipping/ {
                proxy_pass http://shipping:8080/;
            }

            location /api/payment/ {
                proxy_pass http://payment:8080/;
            }

            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prints
  labels:
    project: prints
    component: frontend
    tier: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      project: prints
      component: frontend
      tier: frontend

  template:
    metadata:
      labels:
        project: prints
        component: frontend
        tier: frontend

    spec:
      containers:
        - name: frontend
          image: peruripramod/frontend:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

          readinessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            periodSeconds: 15
            initialDelaySeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            periodSeconds: 15
            initialDelaySeconds: 10

      volumes:
        - name: nginx-config
          configMap:
            name: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prints

spec:
  type: LoadBalancer

  selector:
    project: prints
    component: frontend
    tier: frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80